version: 1
applications:
  - appRoot: marisol-jewelry
    frontend:
      phases:
        preBuild:
          commands:
            - npm install    # ← change this line
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
